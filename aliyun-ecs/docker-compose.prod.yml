services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrate:
    image: ${SERVER_IMAGE}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.server
    environment:
      CI: "true"
      NODE_ENV: production
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]

  server:
    image: ${SERVER_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env.server
    environment:
      CI: "true"
      NODE_ENV: production
      PORT: 3000
    expose:
      - "3000"
    volumes:
      - ./certs/wechat:/app/certs/wechat:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  admin:
    image: ${ADMIN_IMAGE}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    expose:
      - "80"

  proxy:
    image: docker.m.daocloud.io/library/caddy:alpine
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
      admin:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
